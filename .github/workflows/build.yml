name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip shellcheck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui-src/project/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui-src/project
        run: npm ci

      - name: Build WebUI
        working-directory: webui-src/project
        run: npm run build

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify generated ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=(*.zip)

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "Error: build.sh did not generate a ZIP file."
            exit 1
          fi

          for zip_file in "${zips[@]}"; do
            echo "Checking: $zip_file"
            unzip -t "$zip_file"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JerryManager-build
          path: "*.zip"
          if-no-files-found: error
